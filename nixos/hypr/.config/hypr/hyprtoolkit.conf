# hyprtoolkit.conf -- Everforest theme
# Colors are 0xAARRGGBB (alpha first, matching Hyprland's own color format)

background = 0xFF2D353B          # Everforest background
base = 0xFF343F44                # slightly lighter than background
text = 0xFFD3C6AA                # Everforest foreground
alternate_base = 0xFF475258      # Everforest color0/color8
bright_text = 0xFFD3C6AA         # same as text; Everforest has no separate bright variant
accent = 0xFF7FBBB3              # Everforest accent (aqua)
accent_secondary = 0xFFA7C080    # Everforest green, as a secondary accent
