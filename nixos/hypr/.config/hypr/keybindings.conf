###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

# Walker launcher
bindd = $mainMod, SPACE, Show applications, exec, $menu
# Walker media launcher
bindd = $mainMod SHIFT, M, Open media tools, exec, walkermedia
# Walker utilities launcher
bindd = $mainMod SHIFT, U, Open utilities, exec, walkerutilities
# Lock screen
bindd = $mainMod SHIFT, L, Lock screen, exec, hyprlock
# Screenshot
bindd = $mainMod, s, Screenshot region, exec, hyprshot -m region --clipboard-only
# Open terminal
bindd = $mainMod, RETURN, Open terminal, exec, $terminal
# Full screen
bindd = $mainMod SHIFT, F, Fullscreen window, fullscreen, 0
# Voice-to-text
bindd = $mainMod SHIFT, V, Voice-to-text toggle, exec, voxtype record start
bindr = $mainMod SHIFT, V, exec, voxtype record stop
# Move focus with mainMod + vim keys
bindd = $mainMod, h, Move focus left, movefocus, l
bindd = $mainMod, l, Move focus right, movefocus, r
bindd = $mainMod, k, Move focus up, movefocus, u
bindd = $mainMod, j, Move focus down, movefocus, d
# Refresh waybar
bindd = $mainMod, w, Refresh waybar, exec, pkill waybar; waybar &
# Show keybindings menu
bindd = $mainMod SHIFT, K, Show keybindings menu, exec, keybindings

# Turn off laptop monitor when closing it and using external monitor
# 1. Connect external monitor
# 2. Close lid
# 3. Disconnect the external monitor
# 4. Open lid
bindl=,switch:Lid Switch, exec, ~/.config/hypr/switch.sh

bindd = $mainMod, q, Close active window, killactive,
bindd = $mainMod, e, Open file manager, exec, $fileManager
bindd = $mainMod, v, Toggle floating window, togglefloating,
bindd = $mainMod, p, Pseudotile, pseudo, # dwindle
#bind = $mainMod, j, togglesplit, # dwindle

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Scroll to next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Scroll to previous workspace, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, Move window with mouse, movewindow
bindmd = $mainMod, mouse:273, Resize window with mouse, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindld = $mainMod CTRL, RIGHT, Next song, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindld = $mainMod CTRL, LEFT, Previous song, exec, playerctl previous
